# Build + release pipeline for ghuleh-miner.
#
# Every push to master and every manual dispatch builds and smoke-tests both
# artifacts; pushing a v* tag additionally attaches them to a GitHub release.
#
# Artifacts (canonical unversioned names, downloaded via the
# /releases/latest/download/ redirect, no API calls or jq needed):
#   ghuleh-miner-linux-arm64.tar.gz    glibc build for arm64 SBCs/servers
#   ghuleh-miner-android-arm64.tar.gz  Termux/bionic build for phones
#
# Both jobs run on GitHub's free arm64 runners (ubuntu-24.04-arm; free for
# public repos only — private repos bill these runners).
#
# Profile note: both artifacts ship the default rk3588 profile (A76
# hand-scheduled asm). Bench data shows it also helps other wide cores
# (Exynos M4) and the generic-profile delta is only ~2-4% on cores where it
# matters; one binary per OS keeps distribution simple.
#
# Termux compiler note: the android job uses Termux's stock clang (current
# major), which is a known ~5% slower on Verus than the canonical clang-16
# build (see docs / build_clang16_termux.sh). Accepted cost for a zero-setup
# convenience artifact; power users can still build with clang-16 locally.

name: release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Build in Debian 11 container (glibc 2.31 floor)
        run: |
          # Building on the runner's Ubuntu 24.04 produces a binary that
          # demands GLIBC_2.38+ and fails on Debian 11/12, Ubuntu 22.04,
          # Armbian, Raspberry Pi OS — i.e. most real SBCs. Building against
          # Debian 11 (glibc 2.31) runs everywhere alive. clang-16 comes from
          # apt.llvm.org (bullseye ships clang-11). Direct runtime deps are
          # only libcurl4 + libjansson4, whose SONAMEs are stable across the
          # distro decade (OpenSSL was dropped precisely to avoid the
          # libssl 1.1-vs-3 split).
          chmod -R a+w "$PWD"
          docker run --rm -v "$PWD:/repo" -w /repo debian:11 bash -c "
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              ca-certificates wget make libcurl4-openssl-dev libjansson-dev
            wget -qO /etc/apt/trusted.gpg.d/llvm.asc https://apt.llvm.org/llvm-snapshot.gpg.key
            echo 'deb http://apt.llvm.org/bullseye/ llvm-toolchain-bullseye-16 main' \
              > /etc/apt/sources.list.d/llvm.list
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends clang-16 lld-16
            make -j\$(nproc) PRIMO_LINKER=lld-16
          "

      - name: Smoke test (newer-glibc host also proves forward compat)
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4 libjansson4
          ./ghuleh-miner --version
          # Runner cores (Neoverse) have the required AES/PMULL/SHA2 crypto
          # extensions. A short scrypt benchmark exercises the startup
          # self-test (SoA-4 vs reference cross-check) plus real hashing.
          timeout 25 ./ghuleh-miner --benchmark -a scrypt -t 2 2>&1 | tee smoke.log || true
          grep -q "Scrypt self-test passed" smoke.log
          timeout 20 ./ghuleh-miner --benchmark -a verus -t 2 2>&1 | tee smoke2.log || true
          grep -Eq "Hashrate: [0-9]" smoke2.log

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/ghuleh-miner-linux-arm64.tar.gz \
            ghuleh-miner LICENSE NOTICE README.md CONFIG_EXAMPLES.md \
            PROVENANCE.md LICENSES

      - uses: actions/upload-artifact@v4
        with:
          name: ghuleh-miner-linux-arm64
          path: dist/ghuleh-miner-linux-arm64.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ghuleh-miner-linux-arm64.tar.gz

  android-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Build and smoke test inside Termux container
        run: |
          # termux-docker provides a real Termux userland (bionic libc, pkg).
          # Native arm64 host, so no qemu emulation. build_termux.sh installs
          # its own deps and tolerates stale package mirrors.
          # Build and smoke share ONE container session: the runtime libraries
          # installed for the build must be present when the binary runs.
          # The container's 'system' user (uid 1000) must be able to write the
          # runner-owned (uid 1001) bind-mounted workspace.
          chmod -R a+w "$PWD"
          docker run --rm -v "$PWD:/repo" -w /repo \
            termux/termux-docker:aarch64 \
            bash -lc "
              yes | pkg update || true
              bash build_termux.sh &&
              ./ghuleh-miner --version &&
              (timeout 25 ./ghuleh-miner --benchmark -a scrypt -t 2 2>&1 | tee smoke.log || true) &&
              grep -q 'Scrypt self-test passed' smoke.log
            "

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/ghuleh-miner-android-arm64.tar.gz \
            ghuleh-miner LICENSE NOTICE README.md CONFIG_EXAMPLES.md \
            PROVENANCE.md LICENSES

      - uses: actions/upload-artifact@v4
        with:
          name: ghuleh-miner-android-arm64
          path: dist/ghuleh-miner-android-arm64.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ghuleh-miner-android-arm64.tar.gz
